version: "3.8"

services:
  frontend:
    build:
      context: ./frontend
    container_name: frontend
    environment:
      - BACKEND_URL=${BACKEND_URL:-http://backend:8000}
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - app-network

  backend:
    build:
      context: ./backend
    container_name: backend
    environment:
      - API_PORT=${API_PORT:-8000}
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-4}
      - UPLOAD_FOLDER=${UPLOAD_FOLDER:-/app/uploads}
      - WINDOWS_PRICES_DIR=${WINDOWS_PRICES_DIR:-/app/data/windows_prices.xlsx}
      - LINUX_PRICES_DIR=${LINUX_PRICES_DIR:-/app/data/RI_linux_prices.xlsx}
    ports:
      - "${API_PORT:-8000}:${API_PORT:-8000}"
    volumes:
      - backend-uploads:/app/uploads
      - backend-data:/app/data
    networks:
      - app-network

volumes:
  backend-uploads:
  backend-data:

networks:
  app-network:
    driver: bridge
