version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: dockerfile
    container_name: calc-pro-backend
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    environment:
      - PORT=${PORT:-8000}
      - WORKERS=${WORKERS:-4}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - UPLOAD_FOLDER=${UPLOAD_FOLDER:-/app/uploads}
      - WINDOWS_PRICES_DIR=${WINDOWS_PRICES_DIR:-/app/data/windows_prices.xlsx}
      - LINUX_PRICES_DIR=${LINUX_PRICES_DIR:-/app/data/RI_linux_prices.xlsx}
    volumes:
      - ./backend/data:/app/data
      - backend-uploads:/app/uploads
    networks:
      - calc-pro-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile
    container_name: calc-pro-frontend
    ports:
      - "${NGINX_PORT:-80}:80"
    environment:
      - BACKEND_URL=http://backend:${PORT:-8000}
      - NGINX_PORT=80
    depends_on:
      - backend
    networks:
      - calc-pro-network
    restart: unless-stopped

volumes:
  backend-uploads:

networks:
  calc-pro-network:
    driver: bridge
